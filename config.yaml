      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: generative recommendation
          keyword_cn: 生成式推荐
          query: generative models for recommender systems
        - keyword: generative retrieval
          keyword_cn: 生成式检索
          query: generative retrieval for recommendation
        - keyword: HSTU model
          keyword_cn: HSTU模型
          query: Hierarchical Sequential Transformer for User behavior model for sequential recommendation
        - keyword: TIGER model
          keyword_cn: TIGER模型
          query: TIGER transformer index generative retrieval
        - keyword: sequential generation
          keyword_cn: 序列生成
          query: generative sequential recommendation
        - keyword: user behavior transformer
          keyword_cn: 用户行为Transformer
          query: transformer for user behavior modeling in recommendation
      intent_queries:
        - query: Find papers on generative recommendation models, especially those building on HSTU and TIGER paradigms
          query_cn: 查找生成式推荐模型相关的论文，尤其是建立在HSTU和TIGER范式之上的
          enabled: true
          source: manual
          note: ''
